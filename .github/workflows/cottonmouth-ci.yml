name: Cottonmouth Cactus CI

on:
  push:
  pull_request:

jobs:
  cottonmouth:
    name: Build Cactus And Run Cottonmouth Tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CACTUS_PARENT_DIR: ${{ runner.temp }}
      CACTUS_DIR: ${{ runner.temp }}/Cactus
      THORNLIST: ${{ runner.temp }}/Cactus/thornlists/cottonmouth-ci.th
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install .

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gfortran \
            libopenmpi-dev \
            openmpi-bin \
            libhdf5-openmpi-dev \
            perl \
            wget \
            numactl

      - name: Bootstrap Cactus Sources
        run: |
          mkdir -p "$(dirname "$THORNLIST")"
          cp recipes/Cottonmouth/test/test.th "$THORNLIST"
          wget -O "$CACTUS_PARENT_DIR/GetComponents" https://raw.githubusercontent.com/gridaphobe/CRL/master/GetComponents
          chmod +x "$CACTUS_PARENT_DIR/GetComponents"
          cd "$CACTUS_PARENT_DIR"
          ./GetComponents "$THORNLIST"

      - name: Configure SimFactory
        run: |
          cd "$CACTUS_DIR"
          ./simfactory/bin/sim setup-silent

      - name: Build And Run Cottonmouth
        run: bash recipes/Cottonmouth/build-and-run.sh

      - name: Upload Build and Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cottonmouth-logs
          path: |
            ${{ env.CACTUS_DIR }}/make.out
            ${{ env.CACTUS_DIR }}/run.out
            ${{ env.CACTUS_DIR }}/configs/cottonmouth/build.log
