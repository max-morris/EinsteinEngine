name: Cottonmouth Cactus CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  cottonmouth:
    name: Build Cactus And Run Cottonmouth Tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize Cactus Paths
        id: cactus-paths
        run: |
          echo "CACTUS_PARENT_DIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CACTUS_DIR=$RUNNER_TEMP/Cactus" >> "$GITHUB_ENV"
          echo "THORNLIST=$RUNNER_TEMP/Cactus/thornlists/cottonmouth-ci.th" >> "$GITHUB_ENV"
          echo "cactus_dir=$RUNNER_TEMP/Cactus" >> "$GITHUB_OUTPUT"

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install .

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gfortran \
            libopenmpi-dev \
            openmpi-bin \
            libhdf5-openmpi-dev \
            libudev-dev \
            perl \
            wget \
            numactl

      - name: Bootstrap Cactus Sources
        run: |
          mkdir -p "$(dirname "$THORNLIST")"
          cp recipes/Cottonmouth/test/test.th "$THORNLIST"
          wget -O "$CACTUS_PARENT_DIR/GetComponents" https://raw.githubusercontent.com/gridaphobe/CRL/master/GetComponents
          chmod +x "$CACTUS_PARENT_DIR/GetComponents"
          cd "$CACTUS_PARENT_DIR"
          ./GetComponents "$THORNLIST"

      - name: Configure SimFactory
        run: |
          cd "$CACTUS_DIR"
          ./simfactory/bin/sim setup-silent

      - name: Build And Run Cottonmouth
        env:
          OMP_NUM_THREADS: "1"
        run: |
          export COTTONMOUTH_BUILD_JOBS="$(nproc --all)"
          bash recipes/Cottonmouth/build-and-run.sh

      - name: Upload Build and Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cottonmouth-logs
          path: |
            ${{ steps.cactus-paths.outputs.cactus_dir }}/make.out
            ${{ steps.cactus-paths.outputs.cactus_dir }}/run.out
            ${{ steps.cactus-paths.outputs.cactus_dir }}/configs/cottonmouth/build.log
