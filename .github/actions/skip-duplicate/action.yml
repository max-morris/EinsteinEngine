name: Skip Duplicate Runs
description: Shared wrapper around fkirc/skip-duplicate-actions

outputs:
  should_skip:
    description: Whether the current workflow should skip its main job
    value: ${{ steps.skip_check.outputs.should_skip }}

runs:
  using: composite
  steps:
    - id: skip_check
      uses: fkirc/skip-duplicate-actions@v5.3.1
      with:
        cancel_others: "false"
        skip_after_successful_duplicate: "true"
        concurrent_skipping: "same_content_newer"
        do_not_skip: '["pull_request","merge_group","workflow_dispatch","schedule"]'
