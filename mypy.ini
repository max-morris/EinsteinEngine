[mypy]
python_version = 3.13
exclude = (venv|bin/.+?\.py$|TestEinsteinEngine|setup.py|replace-cpp.py)
strict = true
packages = EinsteinEngine

# sympy >=1.13 no longer ships a py.typed marker, but its inline annotations
# are still what we type-check against. follow_untyped_imports analyzes the
# package as if it were typed, preserving the contracts we had under 1.12.1.
[mypy-sympy.*]
follow_untyped_imports = true
